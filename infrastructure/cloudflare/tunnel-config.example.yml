# Cloudflare Tunnel Configuration
# Copy to ~/.cloudflared/config.yml after creating your tunnel
#
# Setup:
#   1. Install cloudflared: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/downloads/
#   2. Login: cloudflared tunnel login
#   3. Create tunnel: cloudflared tunnel create admin-dashboard
#   4. Copy this file: cp tunnel-config.example.yml ~/.cloudflared/config.yml
#   5. Update TUNNEL_ID and hostname below
#   6. Route DNS: cloudflared tunnel route dns admin-dashboard api.yourdomain.com
#   7. Start tunnel: cloudflared tunnel run admin-dashboard

tunnel: <TUNNEL_ID>
credentials-file: /home/<USER>/.cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: api.yourdomain.com
    service: http://localhost:3000
    originRequest:
      noTLSVerify: true
  - service: http_status:404
